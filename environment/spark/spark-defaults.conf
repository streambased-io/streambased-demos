# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

# Example:
spark.sql.extensions                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.hot                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.hot.type             rest
spark.sql.catalog.hot.rest.sigv4-enabled true
spark.sql.catalog.hot.rest.access-key  dummyapi
spark.sql.catalog.hot.rest.secret-key  dummysecret
spark.sql.catalog.hot.rest.signing-region us-east-1
spark.sql.catalog.hot.uri              http://directstream:11001
spark.sql.catalog.hot.io-impl          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.hot.s3.path-style-access  true
spark.sql.catalog.hot.warehouse        s3://
spark.sql.catalog.hot.s3.endpoint      http://directstream:11000
spark.sql.catalog.hot.cache.expiration-interval-ms  10000
spark.sql.defaultCatalog               hot

spark.sql.catalog.cold                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.cold.type             rest
spark.sql.catalog.cold.uri              http://rest:8181
spark.sql.catalog.cold.io-impl          org.apache.iceberg.hadoop.HadoopFileIO
spark.sql.catalog.cold.warehouse       s3a://warehouse/wh/
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                  admin
spark.hadoop.fs.s3a.secret.key                  password
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.region                      us-east-1
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled      false # My MinIO runs on HTTP.
spark.hadoop.fs.s3.impl: org.apache.hadoop.fs.s3a.S3AFileSystem

spark.eventLog.enabled                 true
spark.eventLog.dir                     /home/iceberg/spark-events
spark.history.fs.logDirectory          /home/iceberg/spark-events
spark.sql.catalogImplementation        in-memory